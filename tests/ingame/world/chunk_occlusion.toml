# A gold tower and a pool of water behind a stone wall: from behind the
# wall the occlusion pass keeps them undrawn, and jumping above it shows
# them at once, drawn by the pass's late draws the frame they come into
# view, the water with them. The screenshots show the wall alone, then the
# tower and pool over it.

[[step]]
wait_ms = 2000

[[step]]
chat = "/gamemode creative"

[[step]]
chat = "/gamerule advance_time false"

[[step]]
chat = "/time set 6000"

[[step]]
chat = "/fill -24 -60 8 24 -30 8 minecraft:stone"

[[step]]
chat = "/fill -3 -60 24 3 -40 24 minecraft:gold_block"

[[step]]
chat = "/fill -6 -61 16 6 -61 20 minecraft:water"

[[step]]
chat = "/tp @s 0.5 -60 0.5 0 -10"

[[step]]
expect = { terrain = "settled" }
timeout_ms = 30000

# Chat fades after 10 seconds.
[[step]]
wait_ms = 11000

[[step]]
screenshot = "behind_wall"

[[step]]
chat = "/tp @s 0.5 -10 4 0 65"

[[step]]
wait_ms = 300

[[step]]
screenshot = "over_wall"

[[step]]
chat = "/fill -24 -60 8 24 -30 8 minecraft:air"

[[step]]
chat = "/fill -3 -60 24 3 -40 24 minecraft:air"

[[step]]
chat = "/fill -6 -61 16 6 -61 20 minecraft:grass_block"
